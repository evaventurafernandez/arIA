<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Alertas - España</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header>
  <div class="header-left">
    <h1>Visor de Alertas España</h1>
    <span class="demo-badge">DEMO</span>
    <div id="map-meta">
      <span class="map-meta-item">
        <span class="map-meta-label">Zoom</span>
        <span id="map-zoom">--</span>
      </span>
      <span class="map-meta-item">
        <span class="map-meta-label">BBOX</span>
        <span id="visible-bbox">--</span>
      </span>
      <span class="map-meta-item">
        <span class="map-meta-label">Puntero</span>
        <span id="pointer-coord">--</span>
      </span>
    </div>
  </div>
  <div id="stats-bar">Cargando datos...</div>
</header>

<div class="main">
  <div id="map-container">
    <div id="map-stage">
      <div id="map"></div>

      <!-- Leyenda WMS flotante -->
      <div id="wms-legend" style="display:none"></div>
    </div>

    <!-- Barra temporal -->
    <div id="timelines-bar">
      <div id="historical-timeline" class="timeline-panel" hidden>
        <div id="historical-timeline-top">
          <div id="historical-timeline-label">
            <span id="ht-badge">HISTÓRICO</span>
            <div id="ht-meta">
              <span id="ht-datetime">--</span>
              <div id="ht-statuses">
                <span id="ht-ba-summary" class="historical-summary" data-state="nodata" hidden>--</span>
                <span id="ht-fh-summary" class="historical-summary" data-state="nodata" hidden>--</span>
              </div>
            </div>
          </div>
          <div id="historical-timeline-controls">
            <button id="ht-play" type="button">&#9654; Play</button>
            <button id="ht-reset" type="button">&#8635; Inicio</button>
          </div>
        </div>
        <input type="range" id="ht-slider" min="0" max="0" value="0" />
        <div id="ht-ticks">
          <span id="ht-range-start">--</span>
          <span id="ht-range-end">--</span>
        </div>
        <div id="ht-note">Preparando series históricas...</div>
      </div>

      <div id="timeline" class="timeline-panel">
        <div id="timeline-top">
          <div id="timeline-label">
            <span id="tl-badge">AHORA</span>
            <span id="tl-datetime"></span>
          </div>
          <div id="timeline-controls">
            <button id="tl-play" onclick="togglePlay()">&#9654; Play</button>
            <button id="tl-reset" onclick="resetTimeline()">&#8635; Ahora</button>
          </div>
        </div>
        <input type="range" id="tl-slider" min="0" max="100" value="0"
               oninput="onSliderInput(this.value)"/>
        <div id="tl-ticks"></div>
      </div>
    </div>
  </div>

  <div id="sidebar">

    <!-- Capas datos -->
    <div class="section-fixed">
      <div class="section-title">Datos</div>
      <label class="layer-row">
        <span class="dot" style="background:#FFA500"></span>
        Avisos AEMET
        <input type="checkbox" id="chk-alerts" checked />
      </label>
      <label class="layer-row">
        <span class="dot" style="background:#E94F37"></span>
        Focos NASA FIRMS
        <input type="checkbox" id="chk-fires" checked />
      </label>
      <label class="layer-row">
        <span class="dot" style="background:#ff9d79"></span>
        Histórico NASA FIRMS
        <input type="checkbox" id="chk-firms_history" />
      </label>
    </div>

    <!-- Capas de contexto WMS -->
    <div class="section-fixed">
      <div class="section-title">Capas de riesgo</div>
      <label class="layer-row">
        <span class="dot" style="background:#1e90ff"></span>
        Zonas inundables T=10 (MITECO)
        <input type="checkbox" id="chk-flood"/>
      </label>
      <label class="layer-row">
        <span class="dot" style="background:#8B0000"></span>
        Focos incendio Copernicus (EFFIS)
        <input type="checkbox" id="chk-effis_fires"/>
      </label>
      <label class="layer-row">
        <span class="dot" style="background:#ff6b3d"></span>
        Áreas quemadas diarias Copernicus
        <input type="checkbox" id="chk-burnt_area_daily"/>
      </label>
      <label class="layer-row">
        <span class="dot" style="background:#D97010"></span>
        Peligro de incendio FWI (EFFIS)
        <input type="checkbox" id="chk-effis_fwi"/>
      </label>
      <label class="layer-row">
        <span class="dot" style="background:#8B6914"></span>
        Índice sequía DC (EFFIS)
        <input type="checkbox" id="chk-effis_dc"/>
      </label>
      <label class="layer-row">
        <span class="dot" style="background:#4ce600"></span>
        Usos del suelo completo WMS (IGN)
        <input type="checkbox" id="chk-corine_wms"/>
      </label>
    </div>

    <!-- Filtros -->
    <div class="section-fixed">

      <div class="filter-block">
        <div class="section-title">Nivel de peligro</div>
        <div class="filter-row" id="level-filters">
          <button class="fbtn verde active"    data-level="Verde">Verde</button>
          <button class="fbtn amarillo active" data-level="Amarillo">Amarillo</button>
          <button class="fbtn naranja active"  data-level="Naranja">Naranja</button>
          <button class="fbtn rojo active"     data-level="Rojo">Rojo</button>
        </div>
        <div class="filter-row" id="level-filters">
          <button class="fbtn all active"  data-level="all">Todos</button>
          <button class="fbtn none"        data-level="none">Ninguno</button>
        </div>
      </div>

      <div class="filter-block">
        <div class="section-title">Tipo de aviso</div>
        <select id="event-select">
          <option value="all">Todos los tipos</option>
        </select>
      </div>

    </div>

    <!-- Lista dinámica -->
    <div class="list-header">
      <span id="list-title">Avisos activos</span>
      <div class="list-header-actions">
        <div id="alerts-view-control" class="alerts-view-control">
          <span id="list-count" class="list-count-summary"></span>
          <button id="alerts-view-toggle" class="alerts-view-switch" type="button" aria-pressed="false" title="Mostrando avisos activos y próximos en la lista y en el mapa">
            <span class="alerts-view-switch-label alerts-view-switch-label-all">Todos</span>
            <span class="alerts-view-switch-label alerts-view-switch-label-active">Activos</span>
            <span class="alerts-view-switch-thumb" aria-hidden="true"></span>
          </button>
        </div>
        <span id="fires-list-count" class="list-count-static" hidden></span>
      </div>
    </div>
    <div id="main-list" class="list-scroll">
      <div class="empty">Cargando...</div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>
<script src="app.js"></script>
</body>
</html>
