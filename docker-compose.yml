services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: meteovisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meteovisor}
      POSTGRES_USER: ${POSTGRES_USER:-meteovisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meteovisor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data-store/postgres/data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meteovisor} -d ${POSTGRES_DB:-meteovisor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gdal:
    image: ghcr.io/osgeo/gdal:ubuntu-small-latest
    container_name: meteovisor-gdal
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meteovisor}
      POSTGRES_USER: ${POSTGRES_USER:-meteovisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meteovisor}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
